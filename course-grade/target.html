<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성적관리 - 성적 입력</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="target">
  <header class="site-header">
    <h1>성적관리</h1>
    <nav class="site-nav" aria-label="주요 메뉴">
      <a href="index.html" data-page="index">입력</a>
      <a href="target.html" data-page="target">필요 점수</a>
      <a href="position.html" data-page="position">상대 위치</a>
    </nav>
  </header>
  <main id="app">
    <p id="status" class="notice notice-warn" role="status" hidden></p>

    <section id="empty" class="card" hidden>
      <h2>성적 입력</h2>
      <p>선택된 과목이 없습니다. <a href="index.html">입력 페이지</a>에서 학기와 과목을 먼저 선택하세요.</p>
    </section>

    <div id="content" hidden>
      <section class="card">
        <h2 id="course-title">성적 입력</h2>
        <p id="course-meta" class="hint"></p>

        <div class="table-wrap">
          <table id="items-table" class="items-table">
            <caption class="visually-hidden">평가 항목 표</caption>
            <thead>
              <tr>
                <th scope="col">항목명</th>
                <th scope="col">반영 비율(%)</th>
                <th scope="col">만점</th>
                <th scope="col">내 점수</th>
                <th scope="col">내 순위</th>
                <th scope="col">환산 점수</th>
                <th scope="col">삭제</th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>
        <p id="item-error" class="field-error" role="alert"></p>
        <div class="row">
          <button type="button" id="item-add" class="btn-secondary">항목 추가</button>
        </div>
        <p class="hint">내 점수나 순위를 비워 두면 '미입력'으로 취급하며 0점과 구분합니다.</p>

        <p id="weight-sum" class="weight-sum"></p>
        <p id="weight-warning" class="notice notice-warn" role="alert" hidden></p>
      </section>

      <section class="card">
        <h2>현재 성적 요약</h2>
        <dl class="summary">
          <div><dt>현재 총 환산 점수</dt><dd id="sum-score">-</dd></div>
          <div><dt>점수 입력 완료율</dt><dd id="sum-rate">-</dd></div>
        </dl>
      </section>

      <section class="card">
        <h2>성적 기준</h2>
        <div class="field">
          <label for="basis-select">성적 기준</label>
          <select id="basis-select">
            <option value="general">일반수업</option>
            <option value="english">영어A</option>
            <option value="davinci">다빈치러닝</option>
          </select>
        </div>
        <p id="ratio-info" class="notice notice-ok" role="status"></p>
        <p class="hint">※ 출석 4회 이상 결석 시 F 처리될 수 있습니다.</p>
      </section>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/target.js"></script>
</body>
</html>
