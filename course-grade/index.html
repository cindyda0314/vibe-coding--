<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성적관리 - 과목 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title"><a href="index.html" class="brand" aria-label="CAUG-VIEW 메인 화면으로 이동">CAUG<span class="brand-sub">-VIEW</span></a></h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="index.html" data-page="index">과목 관리</a>
        <a href="target.html" data-page="target">성적 입력</a>
        <a href="position.html" data-page="position">상대 위치</a>
      </nav>
    </div>
  </header>
  <main id="app">
    <div id="status" class="notice notice-warn" role="status" aria-live="polite" hidden></div>

    <section class="card" aria-labelledby="semester-title">
      <h2 id="semester-title">학기</h2>
      <div class="field">
        <label for="semester-select">학기 선택</label>
        <div class="row">
          <select id="semester-select"></select>
          <button type="button" id="semester-delete" class="btn-danger">학기 삭제</button>
        </div>
      </div>
      <form id="semester-form" novalidate>
        <div class="row field">
          <div class="field-inline">
            <label for="semester-year">연도</label>
            <select id="semester-year"></select>
          </div>
          <div class="field-inline">
            <label for="semester-term">학기</label>
            <select id="semester-term"></select>
          </div>
          <button type="submit">추가</button>
        </div>
        <p class="field-error" id="semester-error"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="course-form-title">
      <h2 id="course-form-title">과목 추가</h2>
      <p id="course-form-hint" class="hint" hidden>학기를 먼저 추가하세요.</p>
      <form id="course-form" novalidate>
        <fieldset id="course-fieldset">
          <div class="field">
            <label for="course-name">과목명</label>
            <input id="course-name" type="text" maxlength="50" autocomplete="off">
            <p class="field-error" id="course-name-error"></p>
          </div>
          <div class="field">
            <label for="course-credits">학점</label>
            <input id="course-credits" type="text" inputmode="decimal" placeholder="예: 3" autocomplete="off">
            <p class="field-error" id="course-credits-error"></p>
          </div>
          <div class="field">
            <label for="course-enrollment">전체 수강 인원 (선택)</label>
            <input id="course-enrollment" type="text" inputmode="numeric" placeholder="예: 60" autocomplete="off">
            <p class="field-error" id="course-enrollment-error"></p>
          </div>
          <div class="row">
            <button type="submit" id="course-submit">추가</button>
            <button type="button" id="course-new" class="btn-secondary" hidden>새 과목</button>
          </div>
        </fieldset>
      </form>
    </section>

    <section class="card" aria-labelledby="course-list-title">
      <div class="card-head">
        <h2 id="course-list-title">과목 목록</h2>
        <span id="total-credits" class="total-credits" aria-live="polite">총 0학점</span>
      </div>
      <ul id="course-list" class="course-list"></ul>
      <p id="goto-target" hidden><a href="target.html">선택한 과목의 성적 입력으로 이동</a></p>
    </section>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
